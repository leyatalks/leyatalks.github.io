<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>倦倦的棉花糖睡眠術</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #000;
      background-image: url("兔.JPG"); /* ← 換成你的背景圖片 */
      background-size: cover;
      background-position: center;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: #eefcef;
    }

    .overlay {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.35),
        rgba(0, 0, 0, 0.7)
      );
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px 24px;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .overlay {
        padding: 24px 40px 32px;
      }
    }

    /* ===== 思緒泡泡：背景漂浮層 ===== */
    .thought-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .thought-bubble {
      position: absolute;
      bottom: -40px;
      max-width: 220px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      line-height: 1.4;
      color: #e9fff2;
      background: rgba(15, 40, 28, 0.7);
      border: 1px solid rgba(190, 240, 210, 0.7);
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      opacity: 0;
      animation-name: floatBubble;
      animation-timing-function: ease-out;
      animation-fill-mode: forwards;
    }

    @keyframes floatBubble {
      0% {
        transform: translateY(0) translateX(0) scale(0.9);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      50% {
        transform: translateY(-40vh) translateX(10px) scale(1);
      }
      100% {
        transform: translateY(-75vh) translateX(-5px) scale(0.96);
        opacity: 0;
      }
    }

    /* 主要內容放在泡泡上面 */
    .header,
    .character-box,
    .subtitle-box,
    .controls {
      position: relative;
      z-index: 2;
    }

    /* ===== 右上角控制列（開始 / 暫停 / 停止 / 聲音） ===== */
    .controls {
      position: absolute;
      top: 14px;
      right: 16px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(210, 240, 220, 0.7);
      background: rgba(5, 20, 12, 0.7);
      color: #eaffea;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.7);
      background: rgba(10, 40, 24, 0.9);
    }

    .icon-btn:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    .icon-btn span { pointer-events: none; }

    /* ===== 上方標題區 ===== */
    .header {
      max-width: 900px;
      width: 100%;
      margin: 0 auto 8px auto;
      padding-top: 40px; /* 留空間給右上角按鈕 */
    }

    .header-title {
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 0.95rem;
      color: #d8f4de;
      opacity: 0.92;
    }

    /* ===== 中間角色影片區 ===== */
    .character-box {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 0 12px;
    }

    .character-inner { text-align: center; }

    .character-video {
      width: min(260px, 55vw);
      max-height: 50vh;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
      background: #000;
      margin: 0 auto;
    }

    .character-video video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 睡眠主題：不需要呼吸圈，保留但不會用到 */
    .breathe-circle {
      margin-top: 12px;
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 240, 200, 0.9);
      background: rgba(0, 0, 0, 0.5);
      color: #ffeedd;
      font-size: 0.9rem;
      backdrop-filter: blur(6px);
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.4s ease, transform 0.4s ease;
      white-space: nowrap;
    }
    .breathe-circle.show {
      opacity: 1;
      transform: scale(1);
      animation: sleepy-breath 10s ease-in-out infinite;
    }

    @keyframes sleepy-breath {
      0%   { transform: scale(0.92); opacity: 0.75; }
      40%  { transform: scale(1.08); opacity: 0.95; }
      100% { transform: scale(0.9);  opacity: 0.8; }
    }

    /* ===== 底部字幕框 ===== */
    .subtitle-box {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: rgba(18, 14, 25, 0.92);
      padding: 14px 20px 16px;
      border-radius: 18px;
      border: 1px solid rgba(190, 170, 255, 0.45);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .subtitle-text {
      font-size: 1.1rem;
      line-height: 1.8;
      text-align: center;
      min-height: 2.8em;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.45s ease, transform 0.45s ease;
      white-space: pre-line;
    }
    .subtitle-text.show { opacity: 1; transform: translateY(0); }

    /* ===== 返回入口按鈕 ===== */
.back-home {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 9999;

  display: flex;
  align-items: center;
  gap: 6px;

  padding: 8px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;

  background: rgba(0,0,0,0.55);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.4);
  backdrop-filter: blur(8px);

  cursor: pointer;
  user-select: none;
  transition: transform .15s ease, opacity .15s ease;
}

.back-home:hover {
  transform: translateY(-1px);
  opacity: 0.95;
}

  </style>
</head>

<body>
<div class="overlay">
  <!-- 思緒泡泡浮動層 -->
  <div class="thought-layer" id="thoughtLayer"></div>

  <!-- 控制按鈕：開始 / 暫停 / 停止 / 聲音 -->
  <div class="controls">
    <button class="icon-btn" id="startBtn" title="開始"><span>▶</span></button>
    <button class="icon-btn" id="pauseBtn" title="暫停" disabled><span>⏸</span></button>
    <button class="icon-btn" id="stopBtn" title="停止" disabled><span>⏹</span></button>
    <button class="icon-btn" id="soundBtn" title="背景音樂開關">
      <span id="soundIcon">🔊</span>
    </button>
  </div>

  <!-- 上方大標＋副標 -->
  <header class="header">
    <div class="header-title">倦倦的棉花糖睡眠術</div>
    <div class="header-subtitle">
      當你很累、眼皮很重時，跟倦倦一起慢慢融化，安心睡著。
    </div>
  </header>

  <!-- 中間角色影片（MP4） -->
  <div class="character-box">
    <div class="character-inner">
      <div class="character-video">
        <!-- 把 juanjuan.mp4 換成你的倦倦影片檔名 -->
        <video src="兔子.mp4" autoplay muted loop playsinline></video>
      </div>
      <div class="breathe-circle" id="breatheCircle">放鬆 · 融化 · 入睡</div>
    </div>
  </div>

  <!-- 底部字幕（自動一行一行出現） -->
  <div class="subtitle-box">
    <div class="subtitle-text" id="subtitleText"></div>
  </div>
</div>

<!-- 背景音樂：把 bgm.mp3 換成你的 MP3 檔案 -->
<audio id="bgmAudio" loop>
  <source src="bgm.mp3" type="audio/mpeg" />
</audio>

<script>
/* ===== 倦倦：棉花糖睡眠術（故事字幕） ===== */
const stages = [
  {
    key: "yawn",
    dialog: [
      "「哈......（超長哈欠聲）......」",
      "「終於可以停下來了。你也累壞了吧？」",
      "「眼皮好重喔，身體好像不想動了... 沒關係，我們聽它的。」"
    ],
    duration: 3
  },
  {
    key: "softness",
    dialog: [
      "「來，學我一樣，找個最舒服的姿勢躺好。」",
      "「感覺一下你抱著的枕頭，或者身下的床鋪。」",
      "「它們好軟、好暖和，穩穩地接著你。」"
    ],
    duration: 3
  },
  {
    key: "melting",
    dialog: [
      "「現在，想像你的身體是一顆巨大的棉花糖。」",
      "「從腳趾頭開始......慢慢地融化在床上。」",
      "「膝蓋鬆開了、肚子軟軟的、肩膀沉下去了......」",
      "「最後，連腦袋裡的念頭也融化了。」"
    ],
    duration: 5
  },
  {
    key: "drift",
    dialog: [
      "「什麼都不用擔心了。」",
      "「你很安全，可以放心睡覺。」",
      "「就這樣，輕輕地飄進夢裡吧......」",
      "「晚安...... Zzz......」"
    ],
    duration: 4
  }
];

const subtitleEl = document.getElementById("subtitleText");
const breatheCircle = document.getElementById("breatheCircle");

// 控制按鈕 & 音樂
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const stopBtn = document.getElementById("stopBtn");
const soundBtn = document.getElementById("soundBtn");
const soundIcon = document.getElementById("soundIcon");
const bgmAudio = document.getElementById("bgmAudio");

/* 狀態 */
let stageIndex = 0;
let lineIndex = 0;
let isRunning = false;
let finished = false;
let lineTimeoutId = null;
let stageTimeoutId = null;
let bgmEnabled = true;

// 每一行停留時間（毫秒）
const lineDuration = 3200;

function clearAllTimers() {
  if (lineTimeoutId) clearTimeout(lineTimeoutId);
  if (stageTimeoutId) clearTimeout(stageTimeoutId);
  lineTimeoutId = null;
  stageTimeoutId = null;
}

function resetFlow() {
  clearAllTimers();
  stageIndex = 0;
  lineIndex = 0;
  isRunning = false;
  finished = false;
  subtitleEl.textContent = "";
  subtitleEl.classList.remove("show");
  breatheCircle.classList.remove("show");

  startBtn.disabled = false;
  pauseBtn.disabled = true;
  stopBtn.disabled = true;
}

function playBgmIfNeeded() {
  if (!bgmEnabled) return;
  bgmAudio.play().catch(() => {});
}
function pauseBgm() { bgmAudio.pause(); }
function stopBgm() { bgmAudio.pause(); bgmAudio.currentTime = 0; }

function playNextLine() {
  if (!isRunning) return;

  const stage = stages[stageIndex];

  // 睡眠主題：不強制顯示圈圈（想要就把這段改成特定階段顯示）
  breatheCircle.classList.remove("show");

  if (lineIndex >= stage.dialog.length) {
    clearTimeout(stageTimeoutId);
    stageTimeoutId = setTimeout(() => {
      if (!isRunning) return;
      stageIndex++;
      if (stageIndex < stages.length) {
        lineIndex = 0;
        subtitleEl.classList.remove("show");
        subtitleEl.textContent = "";
        playNextLine();
      } else {
        isRunning = false;
        finished = true;
        pauseBtn.disabled = true;
        startBtn.disabled = false;
      }
    }, stage.duration * 1000);
    return;
  }

  const line = stage.dialog[lineIndex];
  subtitleEl.classList.remove("show");
  void subtitleEl.offsetWidth;
  subtitleEl.textContent = line;
  subtitleEl.classList.add("show");

  lineIndex++;
  clearTimeout(lineTimeoutId);
  lineTimeoutId = setTimeout(playNextLine, lineDuration);
}

/* ===== 按鈕事件 ===== */
startBtn.addEventListener("click", () => {
  if (finished) resetFlow();
  if (isRunning) return;

  isRunning = true;
  playBgmIfNeeded();

  startBtn.disabled = true;
  pauseBtn.disabled = false;
  stopBtn.disabled = false;

  playNextLine();
});

pauseBtn.addEventListener("click", () => {
  if (!isRunning) return;
  isRunning = false;
  clearAllTimers();
  pauseBgm();

  startBtn.disabled = false;
  pauseBtn.disabled = true;
  stopBtn.disabled = false;
});

stopBtn.addEventListener("click", () => {
  isRunning = false;
  finished = false;
  clearAllTimers();
  stopBgm();
  resetFlow();
});

soundBtn.addEventListener("click", () => {
  bgmEnabled = !bgmEnabled;
  if (!bgmEnabled) {
    soundIcon.textContent = "🔇";
    pauseBgm();
  } else {
    soundIcon.textContent = "🔊";
    if (isRunning) playBgmIfNeeded();
  }
});

resetFlow();
startBtn.click();

/* ===== 思緒泡泡：漂浮在背景（5 秒一個，不連續重複） ===== */
const thoughtMessages = [
  "分心也沒關係，你發現了就很好。",
  "腦袋亂很正常，我陪你一起。",
  "不用逼自己專注，只要呼吸就好。",
  "你正在照顧現在的自己。",
  "就算只跟著做一點點也很棒。"
];

const thoughtLayer = document.getElementById("thoughtLayer");
let lastMessage = null;

function getRandomMessage() {
  let msg;
  do {
    msg = thoughtMessages[Math.floor(Math.random() * thoughtMessages.length)];
  } while (msg === lastMessage && thoughtMessages.length > 1);
  lastMessage = msg;
  return msg;
}

function spawnThought() {
  const bubble = document.createElement("div");
  bubble.className = "thought-bubble";
  bubble.textContent = getRandomMessage();

  bubble.style.left = (20 + Math.random() * 60) + "%";

  const duration = 9000 + Math.random() * 7000; // 稍微更慢一點更助眠
  bubble.style.animationDuration = duration + "ms";

  const scale = 0.9 + Math.random() * 0.35;
  bubble.style.transform = `scale(${scale})`;

  thoughtLayer.appendChild(bubble);
  bubble.addEventListener("animationend", () => bubble.remove());
}

setInterval(spawnThought, 5000);

// 返回入口
document.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("backHomeBtn");
  if (!btn) return;
  btn.addEventListener("click", () => {
    window.location.href = "正念.html";
  });
});

</script>

<div class="back-home" id="backHomeBtn">
  ← 返回入口
</div>

</body>
</html>
