<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>狐妮的陽光收藏罐</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #000;
      background-image: url("小木屋.jpg"); /* ← 換成你的背景圖片 */
      background-size: cover;
      background-position: center;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: #eefcef;
    }

    .overlay {
      position: relative;
      width: 100%;
      min-height: 100vh;
      /*background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.35),
        rgba(0, 0, 0, 0.7)
      );*/
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px 24px;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .overlay {
        padding: 24px 40px 32px;
      }
    }

    /* ===== 思緒泡泡：背景漂浮層 ===== */
    .thought-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .thought-bubble {
      position: absolute;
      bottom: -40px;
      max-width: 220px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      line-height: 1.4;
      color: #e9fff2;
      background: rgba(15, 40, 28, 0.7);
      border: 1px solid rgba(190, 240, 210, 0.7);
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      opacity: 0;
      animation-name: floatBubble;
      animation-timing-function: ease-out;
      animation-fill-mode: forwards;
    }

    @keyframes floatBubble {
      0% {
        transform: translateY(0) translateX(0) scale(0.9);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      50% {
        transform: translateY(-40vh) translateX(10px) scale(1);
      }
      100% {
        transform: translateY(-75vh) translateX(-5px) scale(0.96);
        opacity: 0;
      }
    }

    /* 主要內容放在泡泡上面 */
    .header,
    .character-box,
    .subtitle-box,
    .controls {
      position: relative;
      z-index: 2;
    }

    /* ===== 右上角控制列（開始 / 暫停 / 停止 / 聲音） ===== */
    .controls {
      position: absolute;
      top: 14px;
      right: 16px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(210, 240, 220, 0.7);
      background: rgba(5, 20, 12, 0.7);
      color: #eaffea;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, opacity 0.15s ease;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.7);
      background: rgba(10, 40, 24, 0.9);
    }

    .icon-btn:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    .icon-btn span {
      pointer-events: none;
    }

    /* ===== 上方標題區 ===== */
    .header {
      max-width: 900px;
      width: 100%;
      margin: 0 auto 8px auto;
      padding-top: 40px; /* 留點空間給右上角按鈕 */
    }

    .header-title {
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 0.95rem;
      color: #d8f4de;
      opacity: 0.92;
    }

    /* ===== 中間角色影片區 ===== */
    .character-box {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 0 12px;
    }

    .character-inner {
      text-align: center;
    }

    .character-video {
      width: min(260px, 55vw);
      max-height: 50vh;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
      background: #000;
      margin: 0 auto;
    }

    .character-video video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain; /* 透明背景動畫可依需要改 cover */
    }

    /* 暖陽呼吸提示圈（只在暖陽階段顯示） */
    .breathe-circle {
      margin-top: 12px;
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 240, 200, 0.9);
      background: rgba(0, 0, 0, 0.5);
      color: #ffeedd;
      font-size: 0.9rem;
      backdrop-filter: blur(6px);
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.4s ease, transform 0.4s ease;
      white-space: nowrap;
    }
    .breathe-circle.show {
      opacity: 1;
      transform: scale(1);
      animation: sunshine-breath 10s ease-in-out infinite;
    }

    @keyframes sunshine-breath {
      0%   { transform: scale(0.9);  opacity: 0.8; }
      40%  { transform: scale(1.15); opacity: 1;   }
      100% { transform: scale(0.86); opacity: 0.85;}
    }

    /* ===== 底部字幕框 ===== */
    .subtitle-box {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: rgba(25, 18, 10, 0.92);
      padding: 14px 20px 16px;
      border-radius: 18px;
      border: 1px solid rgba(255, 214, 150, 0.55);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .subtitle-text {
      font-size: 1.1rem;
      line-height: 1.8;
      text-align: center;
      min-height: 2.8em;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.45s ease, transform 0.45s ease;
      white-space: pre-line;
    }
    .subtitle-text.show {
      opacity: 1;
      transform: translateY(0);
    }
    /* ===== 返回入口按鈕 ===== */
.back-home {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 9999;

  display: flex;
  align-items: center;
  gap: 6px;

  padding: 8px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;

  background: rgba(0,0,0,0.55);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.4);
  backdrop-filter: blur(8px);

  cursor: pointer;
  user-select: none;
  transition: transform .15s ease, opacity .15s ease;
}

.back-home:hover {
  transform: translateY(-1px);
  opacity: 0.95;
}

  </style>
</head>

<body>
<div class="overlay">
  <!-- 思緒泡泡浮動層 -->
  <div class="thought-layer" id="thoughtLayer"></div>

  <!-- 控制按鈕：開始 / 暫停 / 停止 / 聲音 -->
  <div class="controls">
    <button class="icon-btn" id="startBtn" title="開始">
      <span>▶</span>
    </button>
    <button class="icon-btn" id="pauseBtn" title="暫停" disabled>
      <span>⏸</span>
    </button>
    <button class="icon-btn" id="stopBtn" title="停止" disabled>
      <span>⏹</span>
    </button>
    <button class="icon-btn" id="soundBtn" title="背景音樂開關">
      <span id="soundIcon">🔊</span>
    </button>
  </div>

  <!-- 上方大標＋副標 -->
  <header class="header">
    <div class="header-title">狐妮的陽光收藏罐</div>
    <div class="header-subtitle">
      當你感到開心、心裡暖暖的時候，跟狐妮一起把這份快樂收進心裡。
    </div>
  </header>

  <!-- 中間角色影片（MP4） -->
  <div class="character-box">
    <div class="character-inner">
      <div class="character-video">
        <!-- 把 hunni.mp4 換成你的影片檔 -->
        <video
          src="狐.mp4"
          autoplay
          muted
          loop
          playsinline
        ></video>
      </div>
      <div class="breathe-circle" id="breatheCircle">
        深深吸氣 · 慢慢吐氣
      </div>
    </div>
  </div>

  <!-- 底部字幕（自動一行一行出現） -->
  <div class="subtitle-box">
    <div class="subtitle-text" id="subtitleText"></div>
  </div>
</div>

<!-- 背景音樂：把 bgm.mp3 換成你的 MP3 檔案 -->
<audio id="bgmAudio" loop>
  <source src="pop-39222.mp3" type="audio/mpeg" />
</audio>

<script>
/* ===== 狐妮快樂腳本：自動字幕 ===== */
const stages = [
  {
    key: "spark", // 分享喜悅
    dialog: [
      "「嘿！這裡這裡！你也感覺到了嗎？」",
      "「今天好像發生了什麼好事，心裡覺得暖暖的、跳跳的！」",
      "「這份開心的感覺太珍貴了，我們不要讓它溜走，好嗎？」"
    ],
    duration: 3
  },
  {
    key: "hold", // 捧住光芒
    dialog: [
      "「來，試著像我這樣。」",
      "「把這份開心的感覺，像珍貴的寶石一樣捧在手心。」",
      "「不需要急著去慶祝，我們先停下來，好好看著它。」"
    ],
    duration: 3
  },
  {
    key: "sunshine", // 暖陽呼吸
    dialog: [
      "「現在，我們把這份光芒吸進身體裡。」",
      "「深深吸氣……感覺金色的陽光充滿你的胸口。」",
      "「慢慢吐氣……讓嘴角保持微笑，感覺全身都暖了起來。」",
      "「這份快樂現在屬於你了，誰也拿不走。」"
    ],
    breathing: true,
    duration: 6
  },
  {
    key: "store", // 收藏感恩
    dialog: [
      "「感覺怎麼樣？是不是充滿電了？」",
      "「把這個感覺存在心裡的小撲滿吧。」",
      "「以後如果遇到陰天，記得拿出來用喔！」",
      "「你值得這麼開心，我們下次見！」"
    ],
    duration: 4
  }
];

const subtitleEl = document.getElementById("subtitleText");
const breatheCircle = document.getElementById("breatheCircle");

// 控制按鈕 & 音樂
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const stopBtn = document.getElementById("stopBtn");
const soundBtn = document.getElementById("soundBtn");
const soundIcon = document.getElementById("soundIcon");
const bgmAudio = document.getElementById("bgmAudio");

/* 狀態 */
let stageIndex = 0;
let lineIndex = 0;
let isRunning = false;
let finished = false;
let lineTimeoutId = null;
let stageTimeoutId = null;
let bgmEnabled = true; // 使用者是否想聽音樂

// 每一行停留時間（毫秒）
const lineDuration = 3200;

/* 工具：清除所有計時 */
function clearAllTimers() {
  if (lineTimeoutId) clearTimeout(lineTimeoutId);
  if (stageTimeoutId) clearTimeout(stageTimeoutId);
  lineTimeoutId = null;
  stageTimeoutId = null;
}

/* 重設整個流程 */
function resetFlow() {
  clearAllTimers();
  stageIndex = 0;
  lineIndex = 0;
  isRunning = false;
  finished = false;
  subtitleEl.textContent = "";
  subtitleEl.classList.remove("show");
  breatheCircle.classList.remove("show");

  // 按鈕狀態
  startBtn.disabled = false;
  pauseBtn.disabled = true;
  stopBtn.disabled = true;
}

/* 控制背景音樂 */
function playBgmIfNeeded() {
  if (!bgmEnabled) return;
  bgmAudio.play().catch(() => {
    // 某些瀏覽器若被阻擋就不處理
  });
}

function pauseBgm() {
  bgmAudio.pause();
}

function stopBgm() {
  bgmAudio.pause();
  bgmAudio.currentTime = 0;
}

/* 主流程：顯示下一句字幕 */
function playNextLine() {
  if (!isRunning) return;

  const stage = stages[stageIndex];

  // 暖陽呼吸階段顯示圈圈
  if (stage.breathing) {
    breatheCircle.classList.add("show");
  } else {
    breatheCircle.classList.remove("show");
  }

  // 當前階段的字幕已播完 → 等幾秒，再切下一階段
  if (lineIndex >= stage.dialog.length) {
    clearTimeout(stageTimeoutId);
    stageTimeoutId = setTimeout(() => {
      if (!isRunning) return;
      stageIndex++;
      if (stageIndex < stages.length) {
        lineIndex = 0;
        subtitleEl.classList.remove("show");
        subtitleEl.textContent = "";
        playNextLine();
      } else {
        // 全部結束
        breatheCircle.classList.remove("show");
        isRunning = false;
        finished = true;
        pauseBtn.disabled = true;
        startBtn.disabled = false; // 可以再按開始重新播放（會先 reset）
      }
    }, stage.duration * 1000);
    return;
  }

  // 顯示這一行字幕（淡入）
  const line = stage.dialog[lineIndex];
  subtitleEl.classList.remove("show");
  void subtitleEl.offsetWidth; // 觸發重繪，讓動畫重新跑
  subtitleEl.textContent = line;
  subtitleEl.classList.add("show");

  lineIndex++;
  clearTimeout(lineTimeoutId);
  lineTimeoutId = setTimeout(() => {
    playNextLine();
  }, lineDuration);
}

/* ===== 按鈕事件 ===== */

// 開始：第一次或結束後重新開始
startBtn.addEventListener("click", () => {
  // 如果已經播完一次：重置再播
  if (finished) {
    resetFlow();
  }

  if (isRunning) return;
  isRunning = true;
  playBgmIfNeeded();

  startBtn.disabled = true;
  pauseBtn.disabled = false;
  stopBtn.disabled = false;

  // 如果剛開始且還沒播任何一句
  if (stageIndex === 0 && lineIndex === 0) {
    playNextLine();
  } else {
    // 暫停後繼續：直接往下播
    playNextLine();
  }
});

// 暫停：停在當前句子
pauseBtn.addEventListener("click", () => {
  if (!isRunning) return;
  isRunning = false;
  clearAllTimers();
  pauseBgm();

  startBtn.disabled = false;
  pauseBtn.disabled = true;
  stopBtn.disabled = false;
});

// 停止：全部重來
stopBtn.addEventListener("click", () => {
  isRunning = false;
  finished = false;
  clearAllTimers();
  stopBgm();
  resetFlow();
});

/* 聲音按鈕：開 / 關背景音樂（不影響字幕流程） */
soundBtn.addEventListener("click", () => {
  bgmEnabled = !bgmEnabled;

  if (!bgmEnabled) {
    soundIcon.textContent = "🔇";
    pauseBgm();
  } else {
    soundIcon.textContent = "🔊";
    if (isRunning) {
      playBgmIfNeeded();
    }
  }
});

/* 初始化狀態 */
resetFlow();
startBtn.click();

/* ===== 思緒泡泡：漂浮在背景（5 秒一個，不連續重複） ===== */
const thoughtMessages = [
  "分心也沒關係，你發現了就很好。",
  "腦袋亂很正常，我陪你一起。",
  "不用逼自己專注，只要呼吸就好。",
  "你正在照顧現在的自己。",
  "就算只跟著做一點點也很棒。"
];

const thoughtLayer = document.getElementById("thoughtLayer");
let lastMessage = null;

function getRandomMessage() {
  let msg;
  do {
    msg = thoughtMessages[Math.floor(Math.random() * thoughtMessages.length)];
  } while (msg === lastMessage && thoughtMessages.length > 1);
  lastMessage = msg;
  return msg;
}

function spawnThought() {
  const bubble = document.createElement("div");
  bubble.className = "thought-bubble";
  bubble.textContent = getRandomMessage();

  // 隨機水平位置（20% ~ 80%）
  bubble.style.left = (20 + Math.random() * 60) + "%";

  // 隨機動畫時間（8 ~ 14 秒）
  const duration = 8000 + Math.random() * 6000;
  bubble.style.animationDuration = duration + "ms";

  // 隨機縮放一點點
  const scale = 0.9 + Math.random() * 0.4;
  bubble.style.transform = `scale(${scale})`;

  thoughtLayer.appendChild(bubble);
  bubble.addEventListener("animationend", () => bubble.remove());
}

// 每 5 秒生成一個泡泡
setInterval(spawnThought, 5000);

// 返回入口
document.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("backHomeBtn");
  if (!btn) return;
  btn.addEventListener("click", () => {
    window.location.href = "正念.html";
  });
});

</script>

<div class="back-home" id="backHomeBtn">
  ← 返回入口
</div>

</body>
</html>
